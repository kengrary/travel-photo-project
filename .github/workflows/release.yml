name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # ffmpeg/ffprobe-static 的安装脚本从 GitHub 下载二进制，国内网络可自行加镜像 env：
      # FFMPEG_BINARIES_URL / FFPROBE_BINARIES_URL（npmmirror 提供 -/binary/ 镜像）
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/build-exe.js --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: travel-photo-map-${{ matrix.target }}
          path: release/travel-photo-map-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
